server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # ------------------------------------------------------------
    # REQUEST FLOW (PHP-like model of how Nginx evaluates this config)
    # ------------------------------------------------------------
    #
    # function handleRequest($uri) {
    #
    #   $root = "/var/www/html/public";
    #
    #   // 1. ^~ location: highest-priority prefix rule
    #   if (str_starts_with($uri, "/.well-known/")) {
    #       return 404; // blocked immediately, regex is skipped entirely
    #   }
    #
    #   // 2. location /
    #   // try_files behavior: check if real file exists first
    #   $file = $root . $uri;
    #
    #   if (is_file($file)) {
    #       return serveStaticFile($file); // CSS, JS, images, etc. Does not invoke php.
    #   }
    #
    #   // 3. fallback (internal rewrite by try_files) — nginx re-evaluates all location blocks with the new URI
    #   return handleRequest("/index.php");
    # }
    #
    # ------------------------------------------------------------

    location / {
        # $uri is a built-in nginx variable. It holds the normalized path of the current request
        # (e.g. for a request to /users/123, $uri is /users/123)
        try_files $uri /index.php;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ^~ /.well-known/ {
        return 404;
        access_log off;
    }
}
