server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # ------------------------------------------------------------
    # REQUEST FLOW (PHP-like model of how Nginx evaluates this config)
    # ------------------------------------------------------------
    #
    # function handleRequest($uri) {
    #
    #   $root = "/var/www/html/public";
    #
    #   // 1. ^~ location: highest-priority prefix rule
    #   if (str_starts_with($uri, "/.well-known/")) {
    #       return 404; // blocked immediately, regex is skipped entirely
    #   }
    #
    #   // 2. location /
    #   // try_files behavior: check if real file exists first
    #   $file = $root . $uri;
    #
    #   if (is_file($file)) {
    #       return serveStaticFile($file); // CSS, JS, images, etc. Does not invoke php.
    #   }
    #
    #   // 3. fallback (internal rewrite by try_files) — nginx re-evaluates all location blocks with the new URI
    #   return handleRequest("/index.php");
    # }
    #
    # ------------------------------------------------------------

    location / {
        # $uri is a built-in nginx variable. It holds the normalized path of the current request
        # (e.g. for a request to /users/123, $uri is /users/123)
        try_files $uri /index.php;
    }

    # Nginx cannot execute PHP — delegates .php requests to PHP-FPM via FastCGI protocol.
    location ~ \.php$ {
        # "php" is the Docker service name; 9000 is the default PHP-FPM port
        fastcgi_pass php:9000;
        # Tells PHP-FPM the full path of the file to execute.
        # $document_root = root directive value (/var/www/html/public), $fastcgi_script_name = the .php URI (/index.php)
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Loads nginx's built-in set of standard FastCGI variables (REQUEST_METHOD, QUERY_STRING, etc.)
        # that PHP-FPM needs to process the request — these become the $_SERVER superglobal in PHP.
        include fastcgi_params;
    }

    # Block favicon requests at nginx level so they never reach PHP (browser auto-requests this on every page load).
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    location ^~ /.well-known/ {
        return 404;
        access_log off;
    }
}
