server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Catch-all: unmatched URLs fall through to index.php (front-controller routing).
    location / {
        # $uri checks for a real file first (e.g. CSS, JS, images) so nginx serves them directly without invoking PHP.
        try_files $uri /index.php;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Block /.well-known/ at nginx level to prevent Chrome DevTools auto-requests from hitting PHP.
    location ^~ /.well-known/ {
        return 404;
        access_log off;
    }

    location ~ /\.ht {
        deny all;
    }
}
